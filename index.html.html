<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Espaços — Semana Cultural Tomar 2027</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f4f0;
    --bg3: #eeede8;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9a9a96;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 8px;
    --radius-lg: 12px;
    --green: #1D9E75;
    --amber: #BA7517;
    --red: #E24B4A;
    --green-bg: #EAF3DE;
    --amber-bg: #FAEEDA;
    --red-bg: #FCEBEB;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 0.5px solid var(--border2);
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 14px;
    color: var(--text2);
    margin-top: 4px;
  }

  .days-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.5rem;
  }

  .day-tab {
    flex: 1;
    padding: 10px 8px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    font-size: 13px;
    font-weight: 400;
    color: var(--text2);
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
  }

  .day-tab.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
    font-weight: 500;
  }

  .day-tab:hover:not(.active) {
    background: var(--bg3);
    border-color: var(--border2);
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .spaces-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .space-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
  }

  .space-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .space-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .cap-badge {
    display: inline-flex;
    align-items: center;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .slots-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slot-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .slot-time {
    width: 78px;
    flex-shrink: 0;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-size: 13px;
    color: var(--text);
    background: var(--bg2);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }

  .slot-event {
    flex: 1;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-size: 13px;
    color: var(--text);
    background: var(--bg2);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }

  .slot-pax {
    width: 68px;
    flex-shrink: 0;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 9px;
    font-size: 13px;
    color: var(--text);
    background: var(--bg2);
    font-family: inherit;
    text-align: right;
    transition: border-color 0.15s, background 0.15s;
  }

  .slot-time:focus, .slot-event:focus, .slot-pax:focus {
    outline: none;
    border-color: var(--border2);
    background: var(--bg);
  }

  .slot-pax.over {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-bg);
  }

  .slot-remove {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text3);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    transition: background 0.15s, color 0.15s;
  }

  .slot-remove:hover {
    background: var(--red-bg);
    color: var(--red);
  }

  .empty-slot {
    font-size: 13px;
    color: var(--text3);
    font-style: italic;
    padding: 4px 0;
  }

  .add-slot-btn {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
    border: 0.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .add-slot-btn:hover {
    background: var(--bg2);
    color: var(--text);
    border-color: var(--border2);
  }

  .bar-wrap {
    height: 4px;
    background: var(--bg2);
    border-radius: 2px;
    margin-top: 14px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease, background 0.3s ease;
  }

  .bar-ok   { background: var(--green); }
  .bar-warn { background: var(--amber); }
  .bar-over { background: var(--red); }

  .occ-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 5px;
  }

  .occ-text {
    font-size: 11px;
    color: var(--text3);
  }

  .occ-text.over { color: var(--red); font-weight: 500; }
  .occ-text.warn { color: var(--amber); }

  .col-labels {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
    padding: 0 0;
  }

  .col-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .col-label-time  { width: 78px; flex-shrink: 0; }
  .col-label-event { flex: 1; }
  .col-label-pax   { width: 68px; flex-shrink: 0; text-align: right; }
  .col-label-rm    { width: 28px; flex-shrink: 0; }

  @media (max-width: 480px) {
    body { padding: 1rem 0.75rem; }
    header h1 { font-size: 18px; }
    .space-header { flex-direction: column; align-items: flex-start; }
    .slot-time { width: 66px; }
    .slot-pax  { width: 58px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Gestão de Espaços — Semana Cultural</h1>
    <p>Tomar · 22, 23 e 24 de março de 2027</p>
  </header>

  <div class="days-tabs" id="dayTabs"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Dentro da lotação</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div> Acima de 80%</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Excede a lotação</div>
  </div>

  <div class="spaces-grid" id="spacesGrid"></div>
</div>

<script>
const DAYS = [
  { key: 'd22', label: '22 mar', full: '22 de março de 2027' },
  { key: 'd23', label: '23 mar', full: '23 de março de 2027' },
  { key: 'd24', label: '24 mar', full: '24 de março de 2027' },
];

const SPACES = [
  { id: 's1', name: 'Cineteatro Paraíso', cap: 300 },
  { id: 's2', name: 'Biblioteca Municipal de Tomar', cap: 150 },
  { id: 's3', name: 'Auditório da Jácome', cap: 150 },
  { id: 's4', name: 'Auditório do Centro de Formação Profissional', cap: 150 },
  { id: 's5', name: 'Biblioteca da Jácome', cap: 60 },
];

// ---- State ----
const data = {};
DAYS.forEach(d => {
  data[d.key] = {};
  SPACES.forEach(s => { data[d.key][s.id] = []; });
});
let activeDay = 'd22';

// ---- Persistence ----
function save() {
  try { localStorage.setItem('tomar_espacos_2027', JSON.stringify({ data, activeDay })); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('tomar_espacos_2027');
    if (!raw) return;
    const p = JSON.parse(raw);
    if (p.data) {
      DAYS.forEach(d => SPACES.forEach(s => {
        if (p.data[d.key] && Array.isArray(p.data[d.key][s.id]))
          data[d.key][s.id] = p.data[d.key][s.id];
      }));
    }
    if (p.activeDay) activeDay = p.activeDay;
  } catch(e) {}
}

// ---- Helpers ----
function totalPax(dayKey, spaceId) {
  return data[dayKey][spaceId].reduce((s, sl) => s + (parseInt(sl.pax) || 0), 0);
}
function barClass(pct) {
  if (pct > 100) return 'bar-over';
  if (pct > 80)  return 'bar-warn';
  return 'bar-ok';
}
function occClass(pct) {
  if (pct > 100) return 'over';
  if (pct > 80)  return 'warn';
  return '';
}

// ---- Render Tabs ----
function renderTabs() {
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (d.key === activeDay ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = () => { activeDay = d.key; save(); renderTabs(); renderSpaces(); };
    el.appendChild(btn);
  });
}

// ---- Render Spaces ----
function renderSpaces() {
  const grid = document.getElementById('spacesGrid');
  grid.innerHTML = '';

  SPACES.forEach(space => {
    const slots = data[activeDay][space.id];
    const tot = totalPax(activeDay, space.id);
    const pct = space.cap > 0 ? Math.round((tot / space.cap) * 100) : 0;

    const card = document.createElement('div');
    card.className = 'space-card';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'space-header';
    hdr.innerHTML = `<span class="space-name">${space.name}</span><span class="cap-badge">Lotação: ${space.cap} pessoas</span>`;
    card.appendChild(hdr);

    // Column labels
    if (slots.length > 0) {
      const labels = document.createElement('div');
      labels.className = 'col-labels';
      labels.innerHTML = `
        <span class="col-label col-label-time">Hora</span>
        <span class="col-label col-label-event">Evento</span>
        <span class="col-label col-label-pax">Pax</span>
        <span class="col-label col-label-rm"></span>
      `;
      card.appendChild(labels);
    }

    // Slots
    const slotsList = document.createElement('div');
    slotsList.className = 'slots-list';

    if (slots.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-slot';
      empty.textContent = 'Sem eventos adicionados.';
      slotsList.appendChild(empty);
    }

    slots.forEach((sl, idx) => {
      const row = document.createElement('div');
      row.className = 'slot-row';

      const timeInp = document.createElement('input');
      timeInp.type = 'text';
      timeInp.className = 'slot-time';
      timeInp.placeholder = '00:00';
      timeInp.value = sl.time || '';
      timeInp.oninput = e => { data[activeDay][space.id][idx].time = e.target.value; save(); };

      const evInp = document.createElement('input');
      evInp.type = 'text';
      evInp.className = 'slot-event';
      evInp.placeholder = 'Nome do evento';
      evInp.value = sl.event || '';
      evInp.oninput = e => { data[activeDay][space.id][idx].event = e.target.value; save(); };

      const paxInp = document.createElement('input');
      paxInp.type = 'number';
      paxInp.className = 'slot-pax';
      paxInp.placeholder = 'Pax';
      paxInp.min = 0;
      paxInp.value = sl.pax || '';
      if ((parseInt(sl.pax) || 0) > space.cap) paxInp.classList.add('over');
      paxInp.oninput = e => {
        data[activeDay][space.id][idx].pax = e.target.value;
        save();
        paxInp.classList.toggle('over', (parseInt(e.target.value) || 0) > space.cap);
        refreshBar(card, space.cap, space.id);
      };

      const rmBtn = document.createElement('button');
      rmBtn.className = 'slot-remove';
      rmBtn.innerHTML = '&times;';
      rmBtn.title = 'Remover evento';
      rmBtn.onclick = () => {
        data[activeDay][space.id].splice(idx, 1);
        save();
        renderSpaces();
      };

      row.appendChild(timeInp);
      row.appendChild(evInp);
      row.appendChild(paxInp);
      row.appendChild(rmBtn);
      slotsList.appendChild(row);
    });

    // Add button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-slot-btn';
    addBtn.innerHTML = '+ Adicionar evento';
    addBtn.onclick = () => {
      data[activeDay][space.id].push({ time: '', event: '', pax: '' });
      save();
      renderSpaces();
    };
    slotsList.appendChild(addBtn);

    card.appendChild(slotsList);

    // Bar
    const barWrap = document.createElement('div');
    barWrap.className = 'bar-wrap';
    const barFill = document.createElement('div');
    barFill.className = 'bar-fill ' + barClass(pct);
    barFill.style.width = Math.min(pct, 100) + '%';
    barWrap.appendChild(barFill);
    card.appendChild(barWrap);

    // Occupancy text
    const occRow = document.createElement('div');
    occRow.className = 'occ-row';
    const occText = document.createElement('span');
    const cls = occClass(pct);
    occText.className = 'occ-text' + (cls ? ' ' + cls : '');
    occText.textContent = slots.length > 0 ? `${tot} / ${space.cap} pessoas · ${pct}%` : '';
    occRow.appendChild(occText);
    card.appendChild(occRow);

    grid.appendChild(card);
  });
}

function refreshBar(card, cap, spaceId) {
  const paxInputs = card.querySelectorAll('.slot-pax');
  let tot = 0;
  paxInputs.forEach(p => tot += parseInt(p.value) || 0);
  const pct = cap > 0 ? Math.round((tot / cap) * 100) : 0;

  const fill = card.querySelector('.bar-fill');
  if (fill) {
    fill.className = 'bar-fill ' + barClass(pct);
    fill.style.width = Math.min(pct, 100) + '%';
  }
  const occ = card.querySelector('.occ-text');
  if (occ) {
    const cls = occClass(pct);
    occ.className = 'occ-text' + (cls ? ' ' + cls : '');
    occ.textContent = tot > 0 ? `${tot} / ${cap} pessoas · ${pct}%` : '';
  }
}

// ---- Init ----
load();
renderTabs();
renderSpaces();
</script>
</body>
</html>
