<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador — Semana Cultural Tomar 2027</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --surface3: #2e2e2e;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f0ee;
  --text2: #999992;
  --text3: #555550;
  --accent: #e8c547;
  --accent2: #c9a82c;
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.1);
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --radius: 8px;
  --radius-lg: 14px;
}
body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Login */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg); }
.login-wrap { width: 100%; max-width: 360px; }
.login-eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 1.5rem; }
.login-title { font-size: 28px; font-weight: 400; color: var(--text); line-height: 1.2; margin-bottom: 2rem; }
.login-title em { font-style: italic; color: var(--accent); }
.field-label { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; display: block; }
.field-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 14px; font-size: 16px; color: var(--text); font-family: 'Courier New', monospace; letter-spacing: 0.1em; transition: border-color 0.2s; }
.field-input:focus { outline: none; border-color: var(--accent); }
.btn-login { width: 100%; margin-top: 1rem; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius); padding: 13px; font-size: 14px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
.btn-login:hover { background: var(--accent2); }
.login-error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; font-family: 'Courier New', monospace; }
.login-error.show { display: block; }

/* App */
#app-screen { display: none; min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 54px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-brand { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.topbar-info { font-size: 12px; color: var(--text3); }
.btn-out { background: none; border: 1px solid var(--border2); border-radius: var(--radius); padding: 6px 14px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-out:hover { border-color: var(--red); color: var(--red); }

.main { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

/* Day tabs */
.day-tabs { display: flex; gap: 4px; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.day-tab { padding: 10px 20px; font-size: 13px; font-family: 'Courier New', monospace; letter-spacing: 0.06em; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.day-tab:hover { color: var(--text2); }
.day-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Space cards */
.space-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; transition: border-color 0.15s; }
.space-card:hover { border-color: var(--border2); }
.space-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; gap: 12px; }
.space-name { font-size: 14px; font-weight: 400; color: var(--text); }
.space-cap-tag { font-family: 'Courier New', monospace; font-size: 11px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
.space-right { display: flex; align-items: center; gap: 10px; }
.space-stats { font-family: 'Courier New', monospace; font-size: 11px; color: var(--text3); }
.chevron { color: var(--text3); font-size: 10px; transition: transform 0.2s; }
.space-card.open .chevron { transform: rotate(180deg); }
.space-body { display: none; border-top: 1px solid var(--border); }
.space-card.open .space-body { display: block; }

/* Event list */
.events-section { padding: 1rem 1.25rem; }
.ev-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
.ev-time { font-family: 'Courier New', monospace; font-size: 12px; color: var(--accent); width: 52px; flex-shrink: 0; }
.ev-name { flex: 1; font-size: 13px; color: var(--text); }
.ev-badge { font-family: 'Courier New', monospace; font-size: 11px; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.badge-ok   { background: var(--green-bg); color: var(--green); }
.badge-warn { background: var(--amber-bg); color: var(--amber); }
.badge-full { background: var(--red-bg); color: var(--red); }
.ev-del { background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 8px; font-size: 11px; color: var(--text3); cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.ev-del:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.no-events { font-family: 'Courier New', monospace; font-size: 12px; color: var(--text3); padding: 4px 0 12px; }

/* Add form */
.add-form { border-top: 1px solid var(--border); padding: 1rem 1.25rem; background: var(--surface2); }
.add-form-title { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
.form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg-sm { width: 90px; }
.fg-md { width: 120px; }
.fg-lg { flex: 1; min-width: 180px; }
.fl { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
.fi { background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; color: var(--text); font-family: inherit; transition: border-color 0.15s; width: 100%; }
.fi:focus { outline: none; border-color: var(--accent); }
.btn-add { background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius); padding: 9px 18px; font-size: 12px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.btn-add:hover { background: var(--accent2); }

/* Bar */
.occ-bar { height: 3px; background: var(--surface3); margin: 0 1.25rem 1rem; border-radius: 2px; overflow: hidden; }
.occ-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.fill-ok   { background: var(--green); }
.fill-warn { background: var(--amber); }
.fill-over { background: var(--red); }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #0f0f0f; padding: 10px 18px; border-radius: var(--radius); font-size: 12px; font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 0.06em; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
.toast.show { opacity: 1; }

/* Config alert */
.cfg-alert { background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--radius); padding: 12px 16px; font-size: 12px; color: var(--amber); margin-bottom: 1.5rem; font-family: 'Courier New', monospace; line-height: 1.7; }
.cfg-alert code { background: rgba(251,191,36,0.2); padding: 1px 5px; border-radius: 3px; }

@media (max-width: 500px) {
  .form-row { flex-direction: column; }
  .fg-sm, .fg-md, .fg-lg { width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-eyebrow">Área Restrita</div>
    <div class="login-title">Semana Cultural<br><em>Organizador</em></div>
    <div style="margin-bottom:1rem">
      <label class="field-label">Palavra-passe</label>
      <input type="password" id="pw" class="field-input" placeholder="••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn-login" onclick="login()">Entrar →</button>
    <div class="login-error" id="pw-err">Palavra-passe incorreta.</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <span class="topbar-brand">⚙ Organizador</span>
    <span class="topbar-info">Semana Cultural · Tomar 2027</span>
    <button class="btn-out" onclick="logout()">Sair</button>
  </div>
  <div class="main">
    <div id="cfg-alert" class="cfg-alert" style="display:none">
      ⚠ Cola o URL do Google Apps Script na variável <code>SCRIPT_URL</code> neste ficheiro para ligar ao Google Sheets.
    </div>
    <div class="day-tabs" id="day-tabs"></div>
    <div id="spaces-container"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIGURAÇÃO ──────────────────────────────────────────
const PASSWORD   = "pce";
const SCRIPT_URL = ""; // ← cola aqui o URL do Google Apps Script
// ─────────────────────────────────────────────────────────

const DAYS = [
  { key: 'd22', label: '22 Mar', full: '22 de março de 2027' },
  { key: 'd23', label: '23 Mar', full: '23 de março de 2027' },
  { key: 'd24', label: '24 Mar', full: '24 de março de 2027' },
];
const SPACES = [
  { id: 's1', name: 'Cineteatro Paraíso', cap: 300 },
  { id: 's2', name: 'Biblioteca Municipal de Tomar', cap: 150 },
  { id: 's3', name: 'Auditório da Jácome', cap: 150 },
  { id: 's4', name: 'Auditório do Centro de Formação Profissional', cap: 150 },
  { id: 's5', name: 'Biblioteca da Jácome', cap: 60 },
];

let events = [];
let activeDay = 'd22';
let openCards = {};

// ── Auth ──
function login() {
  const v = document.getElementById('pw').value;
  if (v === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    init();
  } else {
    document.getElementById('pw-err').classList.add('show');
  }
}
function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('pw').value = '';
  document.getElementById('pw-err').classList.remove('show');
}

// ── Storage ──
function save() { try { localStorage.setItem('sc27_events', JSON.stringify(events)); } catch(e){} }
function load() { try { const r = localStorage.getItem('sc27_events'); if(r) events = JSON.parse(r); } catch(e){} }

// ── API ──
async function api(action, data={}) {
  if (!SCRIPT_URL) return null;
  try {
    const r = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({action,...data}) });
    return await r.json();
  } catch(e) { return null; }
}
async function syncEvents() {
  const r = await api('getEvents');
  if (r && r.events) { events = r.events; save(); }
  else load();
}

// ── Toast ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ──
async function init() {
  if (!SCRIPT_URL) document.getElementById('cfg-alert').style.display = 'block';
  await syncEvents();
  renderTabs();
  renderSpaces();
}

// ── Tabs ──
function renderTabs() {
  const el = document.getElementById('day-tabs');
  el.innerHTML = '';
  DAYS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'day-tab' + (d.key === activeDay ? ' active' : '');
    b.textContent = d.label;
    b.onclick = () => { activeDay = d.key; renderTabs(); renderSpaces(); };
    el.appendChild(b);
  });
}

// ── Spaces ──
function renderSpaces() {
  const c = document.getElementById('spaces-container');
  c.innerHTML = '';
  SPACES.forEach(space => {
    const evs = events.filter(e => e.day === activeDay && e.spaceId === space.id);
    const totalReg = evs.reduce((s,e) => s + (parseInt(e.registrations)||0), 0);
    const isOpen = openCards[space.id + activeDay];

    const card = document.createElement('div');
    card.className = 'space-card' + (isOpen ? ' open' : '');

    // Head
    const head = document.createElement('div');
    head.className = 'space-head';
    head.innerHTML = `
      <span class="space-name">${space.name}</span>
      <div class="space-right">
        <span class="space-stats">${evs.length} evento${evs.length!==1?'s':''} · ${totalReg} insc.</span>
        <span class="space-cap-tag">${space.cap} pax</span>
        <span class="chevron">▼</span>
      </div>`;
    head.onclick = () => { openCards[space.id+activeDay] = !isOpen; renderSpaces(); };
    card.appendChild(head);

    // Body
    const body = document.createElement('div');
    body.className = 'space-body';

    // Events list
    const evSec = document.createElement('div');
    evSec.className = 'events-section';
    if (evs.length === 0) {
      evSec.innerHTML = '<div class="no-events">// sem eventos para este dia</div>';
    } else {
      evs.forEach(ev => {
        const reg = parseInt(ev.registrations)||0;
        const pct = ev.maxPax > 0 ? Math.round(reg/ev.maxPax*100) : 0;
        const bc = pct>=100?'badge-full':pct>=80?'badge-warn':'badge-ok';
        const bl = pct>=100?'ESGOTADO':`${reg}/${ev.maxPax}`;
        const row = document.createElement('div');
        row.className = 'ev-row';
        row.innerHTML = `
          <span class="ev-time">${ev.time||'--:--'}</span>
          <span class="ev-name">${ev.name}</span>
          <span class="ev-badge ${bc}">${bl}</span>
          <button class="ev-del" onclick="delEvent('${ev.id}')">✕ remover</button>`;
        evSec.appendChild(row);
      });
    }
    body.appendChild(evSec);

    // Occupancy bar
    const totalEvPax = evs.reduce((s,e)=>s+(parseInt(e.maxPax)||0),0);
    if (evs.length > 0) {
      const pct = Math.min(Math.round(totalReg/totalEvPax*100)||0, 100);
      const fc = pct>=100?'fill-over':pct>=80?'fill-warn':'fill-ok';
      const bar = document.createElement('div');
      bar.className = 'occ-bar';
      bar.innerHTML = `<div class="occ-fill ${fc}" style="width:${pct}%"></div>`;
      body.appendChild(bar);
    }

    // Add form
    const form = document.createElement('div');
    form.className = 'add-form';
    form.innerHTML = `
      <div class="add-form-title">→ Adicionar evento</div>
      <div class="form-row">
        <div class="fg fg-sm">
          <label class="fl">Hora</label>
          <input type="text" class="fi" placeholder="09:00" id="t-${space.id}">
        </div>
        <div class="fg fg-lg">
          <label class="fl">Nome da atividade</label>
          <input type="text" class="fi" placeholder="Ex: Visita guiada" id="n-${space.id}">
        </div>
        <div class="fg fg-md">
          <label class="fl">Vagas máx.</label>
          <input type="number" class="fi" placeholder="${space.cap}" min="1" max="${space.cap}" id="p-${space.id}">
        </div>
        <button class="btn-add" onclick="addEvent('${space.id}')">+ Adicionar</button>
      </div>`;
    body.appendChild(form);
    card.appendChild(body);
    c.appendChild(card);
  });
}

// ── Add Event ──
async function addEvent(spaceId) {
  const name = document.getElementById(`n-${spaceId}`).value.trim();
  const time = document.getElementById(`t-${spaceId}`).value.trim();
  const pax  = parseInt(document.getElementById(`p-${spaceId}`).value) || SPACES.find(s=>s.id===spaceId).cap;
  if (!name) { toast('Escreve o nome da atividade'); return; }
  const ev = {
    id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
    day: activeDay, spaceId, time, name, maxPax: pax, registrations: 0
  };
  events.push(ev);
  save();
  openCards[spaceId+activeDay] = true;
  await api('addEvent', { event: ev });
  toast('Evento adicionado ✓');
  renderSpaces();
}

// ── Delete Event ──
async function delEvent(evId) {
  if (!confirm('Remover este evento?')) return;
  events = events.filter(e => e.id !== evId);
  save();
  await api('deleteEvent', { eventId: evId });
  toast('Evento removido');
  renderSpaces();
}

// ── Boot ──
load();
</script>
</body>
</html>
