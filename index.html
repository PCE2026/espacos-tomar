<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Semana Cultural — Tomar 2027</title>
<style>
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border2: rgba(0,0,0,0.20);
  --text: #181816;
  --text2: #65655f;
  --text3: #a0a09a;
  --accent: #2a5fa5;
  --radius-lg: 14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  text-align: center;
}
.home-logo { font-size: 48px; margin-bottom: 1rem; }
.home-title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.home-sub { font-size: 15px; color: var(--text2); margin-bottom: 2.5rem; }
.home-cards {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 480px;
  width: 100%;
}
.home-card {
  flex: 1;
  min-width: 180px;
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.25rem;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
  text-align: left;
  text-decoration: none;
  color: inherit;
  display: block;
}
.home-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}
.home-card-icon { font-size: 32px; margin-bottom: 10px; }
.home-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.home-card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

.footer { margin-top: 3rem; font-size: 11px; color: var(--text3); }

@media (max-width: 480px) {
  .home-cards { flex-direction: column; }
  .home-card { min-width: unset; }
}
</style>
</head>
<body>

<div class="home-logo">🎭</div>
<div class="home-title">Semana Cultural</div>
<div class="home-sub">Tomar · 22, 23 e 24 de março de 2027</div>

<div class="home-cards">
  <a class="home-card" href="inscricoes.html">
    <div class="home-card-icon">🎟️</div>
    <div class="home-card-title">Inscrever-me</div>
    <div class="home-card-desc">Ver atividades disponíveis e fazer a minha inscrição</div>
  </a>
  <a class="home-card" href="organizador.html">
    <div class="home-card-icon">⚙️</div>
    <div class="home-card-title">Organizador</div>
    <div class="home-card-desc">Gerir espaços, eventos e ver inscrições</div>
  </a>
</div>

<div class="footer">PCE · AET Tomar · 2027</div>

</body>
</html>
